name: Validate source candidate
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  local-checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npm run release:check
      - run: npm run release:package
      - uses: actions/upload-artifact@v4
        with:
          name: benx-source-candidate
          path: test-results/release/*.zip
          retention-days: 7
